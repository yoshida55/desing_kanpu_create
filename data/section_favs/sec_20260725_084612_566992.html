@scope{
:root { --green: #22b573; --green-dark: #137c55; --mint: #effaf4; --mint-2: #dff5e9; --lime: #e5ff9e; --ink: #221814; --white: #fff; --line: rgba(19, 124, 85, 0.17); --shadow: 0 12px 32px rgba(25, 117, 80, 0.12); --shadow-strong: 0 24px 64px rgba(25, 117, 80, 0.18); --container: min(1440px, calc(100% - 80px)); --hero: clamp(2.2rem, 5vw, 3.6rem); --section: clamp(1.6rem, 3vw, 2.4rem); --small: clamp(1.1rem, 1.6vw, 1.25rem); --body: clamp(0.95rem, 1.1vw, 1rem); }
* { box-sizing: border-box; }
:scope{box-sizing: border-box;}
img { display: block; width: 100%; height: 100%; object-fit: cover; }
::selection { background: var(--lime); color: var(--ink); }
.cep566992-container { width: var(--container); margin-inline: auto; }
.cep566992-section { position: relative; min-height: 100vh; padding: 12vh 0px; display: flex; align-items: center; overflow: hidden; }
:scope{position: relative; min-height: 100vh; padding: 12vh 0px; display: flex; align-items: center; overflow: hidden;}
.cep566992-section-inner { width: 100%; }

.cep566992-eyebrow::before { content: ""; width: 28px; height: 2px; background: var(--green); }

:scope .cep566992-reveal{opacity: 0; transform: translateY(32px);}
.cep566992-reveal { transition-behavior: normal, normal; transition-duration: 0.85s, 0.85s; transition-timing-function: ease-out, ease-out; transition-property: opacity, transform; transition-delay: var(--delay, 0s); }
.cep566992-reveal.is-visible { opacity: 1 !important; transform: none !important; }

.cep566992-checks li { position: relative; padding: 14px 0px 14px 34px; border-bottom: 1px solid var(--line); font-weight: 700; }
.cep566992-checks li::before { content: ""; position: absolute; left: 4px; top: 23px; width: 13px; height: 7px; border-left: 3px solid var(--green); border-bottom: 3px solid var(--green); transform: rotate(-45deg); }
