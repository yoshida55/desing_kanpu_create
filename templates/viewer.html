<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>デザイン参照ストック — 検索</title>
  <style>
    /* ┌─────────────────────────────────────────┐
       │ 共通                                       │
       └─────────────────────────────────────────┘ */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }

    /* ┌─────────────────────────────────────────┐
       │ 検索バー（上部に固定）                      │
       └─────────────────────────────────────────┘ */
    /* position: fixed は親1箇所だけ（中の要素は通常フロー） */
    .search_bar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e0e0e0;
      padding: 1rem 2.4rem; /* ギャラリーを広く見せるため上下を詰める */
    }
    /* 検索ボックスと件数指定を横並びにする親 */
    .search_inner {
      display: flex; /* 入力欄とボタンを1行に */
      gap: 1.2rem;
      align-items: center;
      max-width: 90rem;
      margin: 0 auto;
    }
    .search_input {
      flex: 1;
      font-size: 1.7rem;
      padding: 1.2rem 1.6rem;
      border: 1px solid #d0d0d5;
      border-radius: 1rem;
      outline: none;
    }
    .search_input:focus { border-color: #0066cc; }
    .search_top {
      width: 7rem;
      font-size: 1.5rem;
      padding: 1.2rem 0.8rem;
      border: 1px solid #d0d0d5;
      border-radius: 1rem;
      text-align: center;
    }
    .search_button {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      background: #0066cc;
      border: none;
      border-radius: 1rem;
      padding: 1.2rem 2.4rem;
      cursor: pointer;
    }
    .search_button:hover { background: #0055aa; }
    .search_hint {
      max-width: 90rem;
      margin: 0.6rem auto 0;
      font-size: 1.2rem;
      color: #86868b;
    }

    /* ┌─────────────────────────────────────────┐
       │ コンパクトなツールバー（設定/生成/登録を1行に）│
       └─────────────────────────────────────────┘ */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      max-width: 90rem;
      margin: 0.8rem auto 0;
    }
    .tool_btn {
      font-size: 1.3rem;
      font-weight: 700;
      border-radius: 1rem;
      padding: 0.6rem 1.4rem;
      cursor: pointer;
    }
    .tool_set  { color: #444;    background: #eee;     border: 1px solid #ddd; }
    .tool_set:hover  { background: #e4e4e4; }
    .tool_camp { color: #b8530a; background: #fff3e8;  border: 1px solid #ffd2a8; }
    .tool_camp:hover { background: #ffe9d6; }
    .tool_add  { color: #0066cc; background: #eaf2fb;  border: 1px solid #c7ddf5; }
    .tool_add:hover  { background: #dceafb; }
    /* トグルで開くパネルは中央寄せ・詰めた余白で表示 */
    .set_panel, .camp_panel, .add_panel { max-width: 90rem; margin: 0.8rem auto 0; }
    /* 設定内の区切り（言語化ブロックを軽く分ける） */
    .set_row_sep { border-top: 1px solid #eee; padding-top: 1.2rem; margin-top: 0.4rem; }

    /* ┌─────────────────────────────────────────┐
       │ 登録（URLを追加する入力ボックス）           │
       └─────────────────────────────────────────┘ */
    /* 設定パネル */
    .set_box { max-width: 90rem; margin: 1rem auto 0; }
    .set_toggle {
      font-size: 1.3rem; color: #444; background: #eee;
      border: 1px solid #ddd; border-radius: 1rem;
      padding: 0.7rem 1.4rem; cursor: pointer;
    }
    .set_toggle:hover { background: #e4e4e4; }
    .set_panel {
      display: none;
      margin-top: 1rem;
      padding: 1.6rem;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 1rem;
    }
    .set_panel.is_open { display: block; }
    .set_row {
      display: flex; /* ラベルと入力を1行に */
      align-items: center;
      gap: 1.2rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .set_label { width: 14rem; font-size: 1.3rem; color: #555; }
    .set_radio { font-size: 1.4rem; }
    .set_input {
      flex: 1;
      min-width: 24rem;
      font-size: 1.4rem;
      padding: 0.8rem 1.2rem;
      border: 1px solid #d0d0d5;
      border-radius: 0.8rem;
    }
    .set_input_s { flex: 0 0 16rem; min-width: 12rem; }
    .set_state { font-size: 1.2rem; color: #888; }
    .set_actions { display: flex; align-items: center; gap: 1.2rem; }
    .set_save {
      font-size: 1.4rem; font-weight: 700; color: #fff; background: #1d1d1f;
      border: none; border-radius: 1rem; padding: 0.9rem 1.8rem; cursor: pointer;
    }
    .set_save:hover { background: #000; }
    .set_test {
      font-size: 1.3rem; color: #1d1d1f; background: #f0f0f2;
      border: 1px solid #ddd; border-radius: 1rem; padding: 0.9rem 1.4rem; cursor: pointer;
    }
    .set_test:hover { background: #e6e6ea; }
    .set_msg { font-size: 1.3rem; color: #444; }

    /* 一括アクションのまとまり */
    .bulk_box {
      max-width: 90rem;
      margin: 1.2rem auto 0;
      display: flex; /* ボタンと状況を横並び */
      align-items: center;
      gap: 1.2rem;
    }
    .bulk_button {
      font-size: 1.3rem;
      color: #4b2ea8;
      background: #efe9ff;
      border: 1px solid #d6c9ff;
      border-radius: 1rem;
      padding: 0.8rem 1.6rem;
      cursor: pointer;
    }
    .bulk_button:hover { background: #e4dbff; }
    .bulk_button:disabled { color: #aaa; cursor: default; }
    .bulk_state { font-size: 1.25rem; color: #6e6e73; }

    /* カンプ生成 */
    .camp_box { max-width: 90rem; margin: 1rem auto 0; }
    .camp_toggle {
      font-size: 1.35rem;
      font-weight: 700;
      color: #b8530a;
      background: #fff3e8;
      border: 1px solid #ffd2a8;
      border-radius: 1rem;
      padding: 0.8rem 1.6rem;
      cursor: pointer;
    }
    .camp_toggle:hover { background: #ffe9d6; }
    .camp_panel { display: none; margin-top: 1rem; }
    .camp_panel.is_open { display: block; }
    /* mix & match：ベース／アニメ参照のセレクト */
    .camp_mix { display: flex; gap: 1.2rem; flex-wrap: wrap; margin-bottom: 0.8rem; }
    .camp_lbl { flex: 1; min-width: 26rem; font-size: 1.25rem; color: #555; display: flex; flex-direction: column; gap: 0.4rem; }
    .camp_sel {
      font-size: 1.35rem; padding: 0.7rem 1rem; border: 1px solid #d0d0d5;
      border-radius: 0.8rem; background: #fff; cursor: pointer;
    }
    .camp_input {
      width: 100%;
      min-height: 7rem;
      font-size: 1.4rem;
      font-family: inherit;
      padding: 1.2rem 1.6rem;
      border: 1px solid #d0d0d5;
      border-radius: 1rem;
      outline: none;
      resize: vertical;
    }
    .camp_input:focus { border-color: #b8530a; }
    .camp_actions { display: flex; align-items: center; gap: 1.2rem; margin-top: 0.8rem; }
    .camp_button {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      background: #b8530a;
      border: none;
      border-radius: 1rem;
      padding: 1rem 2rem;
      cursor: pointer;
    }
    .camp_button:hover { background: #a04708; }
    .camp_button:disabled { background: #ccc; cursor: default; }
    .camp_state { font-size: 1.3rem; color: #6e6e73; }
    .camp_state a { color: #b8530a; font-weight: 700; }
    /* 生成中の進捗バー */
    .camp_progress { display: none; margin-top: 1.2rem; }
    .camp_progress.is_on { display: block; }
    .camp_bar {
      height: 0.8rem;
      background: #f0e3d4;
      border-radius: 0.4rem;
      overflow: hidden;
    }
    /* 終わりが読めない処理なので、流れ続けるインジケータ（不確定バー） */
    .camp_bar span {
      display: block;
      height: 100%;
      width: 35%;
      background: #b8530a;
      border-radius: 0.4rem;
      animation: camp_flow 1.3s ease-in-out infinite;
    }
    @keyframes camp_flow {
      0% { margin-left: -35%; }
      100% { margin-left: 100%; }
    }
    .camp_prog_text { margin-top: 0.6rem; font-size: 1.3rem; color: #6e6e73; }
    /* 複数ジョブの一覧（同時進行を並べる） */
    .camp_jobs { margin-top: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .camp_job {
      border: 1px solid #eee; border-radius: 0.8rem; padding: 0.8rem 1.1rem;
      background: #fafafa; font-size: 1.3rem; color: #444;
    }
    .camp_job.is_done { background: #f2f9f2; border-color: #cfe9cf; }
    .camp_job.is_err { background: #fdf2f2; border-color: #f0cccc; color: #b00; }
    .camp_job_bar { height: 0.6rem; background: #f0e3d4; border-radius: 0.3rem; overflow: hidden; margin-bottom: 0.5rem; }
    .camp_job_bar span {
      display: block; height: 100%; width: 35%; background: #b8530a; border-radius: 0.3rem;
      animation: camp_flow 1.3s ease-in-out infinite;
    }
    .camp_job a { color: #b8530a; font-weight: 700; }
    /* 部分編集：改善案チップ＋自由指示 */
    .camp_edit_row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin-top: 0.6rem; }
    .camp_suggest_btn {
      font-size: 1.2rem; color: #4b2ea8; background: #efe9ff; border: 1px solid #d6c9ff;
      border-radius: 0.8rem; padding: 0.5rem 1rem; cursor: pointer; white-space: nowrap;
    }
    .camp_suggest_btn:hover { background: #e4dbff; }
    .camp_edit_in {
      flex: 1; min-width: 18rem; font-size: 1.2rem; padding: 0.5rem 0.8rem;
      border: 1px solid #d0d0d5; border-radius: 0.8rem;
    }
    .camp_editall_btn {
      font-size: 1.2rem; color: #b8530a; background: #fff3e8; border: 1px solid #ffd2a8;
      border-radius: 0.8rem; padding: 0.5rem 1rem; cursor: pointer; white-space: nowrap;
    }
    .camp_editall_btn:hover { background: #ffe9d6; }
    .camp_sugg { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }
    .sugg_chip {
      font-size: 1.2rem; color: #1d1d1f; background: #fff; border: 1px solid #d8d8dd;
      border-radius: 1rem; padding: 0.5rem 1rem; cursor: pointer; text-align: left;
    }
    .sugg_chip:hover { background: #f0f0f2; border-color: #b8b8bf; }

    .add_box {
      max-width: 90rem;
      margin: 1.2rem auto 0;
    }
    /* 開閉する見出し（クリックで入力欄が出る） */
    .add_toggle {
      font-size: 1.3rem;
      color: #0066cc;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    .add_toggle:hover { text-decoration: underline; }
    /* 入力欄ひとまとまり（既定は非表示） */
    .add_panel {
      display: none;
      margin-top: 1rem;
    }
    .add_panel.is_open { display: block; }
    .add_input {
      width: 100%;
      min-height: 8rem;
      font-size: 1.4rem;
      font-family: inherit;
      padding: 1.2rem 1.6rem;
      border: 1px solid #d0d0d5;
      border-radius: 1rem;
      outline: none;
      resize: vertical;
    }
    .add_input:focus { border-color: #0066cc; }
    .add_actions {
      display: flex; /* ボタンと状況メッセージを横並びに */
      align-items: center;
      gap: 1.2rem;
      margin-top: 0.8rem;
    }
    .add_button {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      background: #1d1d1f;
      border: none;
      border-radius: 1rem;
      padding: 1rem 2rem;
      cursor: pointer;
    }
    .add_button:hover { background: #000000; }
    .add_button:disabled { background: #b0b0b5; cursor: default; }
    .add_state { font-size: 1.3rem; color: #6e6e73; }

    /* ┌─────────────────────────────────────────┐
       │ 検索結果                                   │
       └─────────────────────────────────────────┘ */
    .result_status {
      max-width: 120rem;
      margin: 1rem auto 0;
      padding: 0 2.4rem;
      font-size: 1.4rem;
      color: #6e6e73;
    }
    /* カードを並べる親（列数はあとで変えやすいよう手法は名前に入れない） */
    /* カードは小さめ＝一度にたくさん見渡せるようにする */
    .result_list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr));
      gap: 1.6rem;
      max-width: 150rem;
      margin: 1rem auto;
      padding: 0 2.4rem 4rem;
    }
    .result_item {
      background: #ffffff;
      border-radius: 1.2rem;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    /* 画像の上にスコアを乗せる土台。ホバー中は全体(fullpage)を流す */
    .result_anchor {
      position: relative;
      display: block;
      aspect-ratio: 1440 / 900; /* 撮影viewport比の窓 */
      overflow: hidden; /* fullpageのはみ出しを隠す＝この窓の中だけ見せる */
      background: #eee;
      cursor: pointer; /* クリックで詳細が開くことを示す */
    }
    /* 「詳細を見る」の常時表示の目印（クリックできると分かるように） */
    .result_anchor::after {
      content: "🔍 詳細";
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.1rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 0.3rem 0.8rem;
      border-radius: 0.8rem;
      pointer-events: none;
    }
    /* ファーストビュー（通常時に見せる画像） */
    .result_img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
      transition: opacity 0.2s;
    }
    /* ページ全体（ホバー時に上から下へ流して見せる） */
    .result_full {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: auto; /* 縦長のまま。JSでtranslateYして流す */
      display: block;
      opacity: 0;
    }
    .result_anchor.is_preview .result_img { opacity: 0; }
    .result_anchor.is_preview .result_full { opacity: 1; }
    /* 録画した動き（ホバー時に再生） */
    .result_video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
      opacity: 0;
    }
    /* 動画があるカードは、ホバー時に静止画スクロールではなく動画を見せる */
    .result_anchor.is_video.is_preview .result_full { opacity: 0; }
    .result_anchor.is_video.is_preview .result_video { opacity: 1; }
    /* ホバー中だと分かる小さな目印 */
    .result_peek {
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      font-size: 1rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.55);
      padding: 0.3rem 0.7rem;
      border-radius: 0.6rem;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .result_anchor:hover .result_peek { opacity: 1; }
    /* 画像左上に乗せるスコアのバッジ */
    .result_score {
      position: absolute;
      top: 1rem;
      left: 1rem;
      font-size: 1.2rem;
      font-weight: 700;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.6);
      padding: 0.4rem 0.9rem;
      border-radius: 0.8rem;
    }
    .result_body { padding: 1.2rem 1.6rem 1.6rem; }
    .result_url {
      display: block;
      font-size: 1.3rem;
      color: #0066cc;
      word-break: break-all;
      text-decoration: none;
      margin-bottom: 0.8rem;
    }
    .result_url:hover { text-decoration: underline; }
    /* 検出したアニメ系ライブラリのタグ（カンプ生成の手がかり） */
    .result_libs {
      display: flex; /* タグを横に並べる */
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }
    .result_lib {
      font-size: 1.05rem;
      color: #7a3e00;
      background: #fff2e0;
      border: 1px solid #ffd9a8;
      border-radius: 0.6rem;
      padding: 0.2rem 0.7rem;
    }
    /* 抽出した配色のスワッチ */
    .result_swatches {
      display: flex; /* 色のチップを横に並べる */
      gap: 0.4rem;
      margin-bottom: 0.8rem;
    }
    .result_swatch {
      width: 2rem;
      height: 2rem;
      border-radius: 0.4rem;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
    /* ベースに生成ボタン */
    .result_base {
      font-size: 1.15rem;
      color: #b8530a;
      background: #fff3e8;
      border: 1px solid #ffd2a8;
      border-radius: 0.8rem;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .result_base:hover { background: #ffe9d6; }
    .result_base:disabled { color: #aaa; cursor: default; }

    /* Claudeが書いた雰囲気の説明文 */
    .result_vibe {
      font-size: 1.15rem;
      line-height: 1.6em;
      color: #555;
      margin: 0 0 0.8rem;
      background: #f7f5ff;
      border-left: 3px solid #b9a9ff;
      padding: 0.7rem 0.9rem;
      border-radius: 0.4rem;
    }
    /* 雰囲気を言語化ボタン */
    .result_describe {
      font-size: 1.15rem;
      color: #4b2ea8;
      background: #efe9ff;
      border: 1px solid #d6c9ff;
      border-radius: 0.8rem;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .result_describe:hover { background: #e4dbff; }
    .result_describe:disabled { color: #aaa; cursor: default; }
    .result_meta {
      display: flex; /* 日付とボタン群。カードが狭いので折り返す */
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .result_date { font-size: 1.1rem; color: #86868b; }
    .result_similar {
      font-size: 1.2rem;
      color: #1d1d1f;
      background: #f0f0f2;
      border: 1px solid #e0e0e0;
      border-radius: 0.8rem;
      padding: 0.5rem 1.1rem;
      cursor: pointer;
    }
    .result_similar:hover { background: #e6e6ea; }
    /* 削除ボタン（控えめな見た目・ホバーで赤く） */
    .result_delete {
      font-size: 1.2rem;
      color: #999;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
    }
    .result_delete:hover { color: #d0021b; }
    /* 動きを録るボタン */
    .result_record {
      font-size: 1.15rem;
      color: #1d1d1f;
      background: #f0f0f2;
      border: 1px solid #e0e0e0;
      border-radius: 0.8rem;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .result_record:hover { background: #e6e6ea; }
    .result_record:disabled { color: #aaa; cursor: default; }
    /* ボタン群をまとめる箱（似てる／雰囲気／ベース／録画／削除）
       カードが狭いので折り返し可。各ボタンは改行させない(nowrap) */
    .result_tools {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    /* カード内のボタンは全部コンパクト＆1語で改行させない（縦積み文字化を防ぐ） */
    .result_similar,
    .result_describe,
    .result_base,
    .result_record {
      font-size: 1.1rem;
      padding: 0.4rem 0.7rem;
      white-space: nowrap;
    }
    .result_delete { padding: 0.4rem; }
    .result_empty {
      max-width: 120rem;
      margin: 4rem auto;
      padding: 0 2.4rem;
      color: #86868b;
      font-size: 1.5rem;
    }

    /* ┌─────────────────────────────────────────┐
       │ 詳細ビュー（モーダル）                      │
       └─────────────────────────────────────────┘ */
    /* 画面全体を覆う土台（position: fixed は親のここ1箇所だけ） */
    .detail_overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 100;
      padding: 1.2rem; /* 余白を減らして中身(ポップアップ)を大きく */
    }
    .detail_overlay.is_open { display: flex; }
    .detail_modal {
      background: #fff;
      border-radius: 1.4rem;
      width: 100%;
      max-width: 150rem;   /* ポップアップ自体を大きく */
      margin: auto;
      max-height: 96vh;    /* 縦もほぼ画面いっぱいに */
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .detail_close {
      position: absolute;
      top: 1.2rem;
      right: 1.2rem;
      font-size: 1.8rem;
      width: 3.6rem;
      height: 3.6rem;
      border: none;
      border-radius: 50%;
      background: #f0f0f2;
      cursor: pointer;
      z-index: 2;
    }
    .detail_close:hover { background: #e2e2e6; }
    /* URLと撮影日を横並びにしてヘッダーを薄く（縦を節約） */
    .detail_head {
      padding: 1rem 5rem 1rem 2.4rem;   /* 右は✕ボタンぶん空ける */
      border-bottom: 1px solid #eee;
      display: flex; align-items: baseline; gap: 1.2rem; flex-wrap: wrap;
    }
    .detail_url { font-size: 1.5rem; color: #0066cc; word-break: break-all; text-decoration: none; }
    .detail_url:hover { text-decoration: underline; }
    .detail_date { font-size: 1.2rem; color: #999; white-space: nowrap; }
    /* 縦積み：上=ビジュアル(動画を大きく) / 下=情報。全体を縦スクロール */
    .detail_body {
      display: flex;
      flex-direction: column;   /* 左右分割 → 上下積みに変更 */
      gap: 0;
      overflow-y: auto;
      flex: 1;
    }
    .detail_visual {
      width: 100%;
      background: #f5f5f7;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .detail_tabs { display: flex; gap: 0.6rem; padding: 0.9rem 1.2rem; flex-wrap: wrap; align-items: center; }
    /* アニメ再生のモードボタンをタブ行の右端に寄せるスロット */
    .detail_modebar_slot { margin-left: auto; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    .detail_tab {
      font-size: 1.3rem; padding: 0.6rem 1.4rem; border-radius: 0.8rem;
      border: 1px solid #ddd; background: #fff; cursor: pointer;
    }
    .detail_tab.is_on { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
    /* 上部ビジュアルは大きく見せる。縦長スクショはこの中でスクロール */
    .detail_pane { overflow: auto; padding: 0 1.2rem 1.2rem; max-height: 78vh; }
    .detail_pane img { width: 100%; display: block; border-radius: 0.6rem; }
    .detail_pane video { width: 100%; display: block; border-radius: 0.6rem; background: #000; }
    .detail_info { width: 100%; padding: 1.8rem 2.4rem; border-top: 1px solid #eee; }
    .detail_h { font-size: 1.25rem; color: #888; margin: 1.6rem 0 0.6rem; }
    .detail_h:first-child { margin-top: 0; }
    .detail_swatches { display: flex; flex-wrap: wrap; gap: 0.6rem; }
    /* 色チップ（クリックでコピー） */
    .detail_swatch {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 1.15rem; padding: 0.3rem 0.6rem 0.3rem 0.3rem;
      border: 1px solid #e0e0e0; border-radius: 0.8rem; cursor: pointer; background: #fff;
    }
    .detail_swatch:hover { background: #f4f4f6; }
    .detail_chip { width: 2rem; height: 2rem; border-radius: 0.4rem; border: 1px solid rgba(0,0,0,.1); }
    .detail_kv { font-size: 1.3rem; color: #444; line-height: 1.8em; }
    .detail_libs { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .detail_vibe { font-size: 1.3rem; line-height: 1.7em; color: #555; background: #f7f5ff; border-left: 3px solid #b9a9ff; padding: 0.9rem 1.1rem; border-radius: 0.4rem; }
    /* 抜き出した画像のギャラリー */
    .detail_assets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr));
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }
    .detail_asset {
      aspect-ratio: 1;
      border: 1px solid #eee;
      border-radius: 0.6rem;
      overflow: hidden;
      background: #faf7f2 center/12px 12px;
    }
    .detail_asset img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .detail_extract {
      font-size: 1.3rem; color: #b8530a; background: #fff3e8;
      border: 1px solid #ffd2a8; border-radius: 0.9rem; padding: 0.7rem 1.4rem; cursor: pointer;
    }
    .detail_extract:hover { background: #ffe9d6; }
    .detail_extract:disabled { color: #aaa; cursor: default; }
    /* 抜き出したアニメ素材（keyframes/transitionのコード片・Lottie） */
    .detail_anim { margin-bottom: 0.8rem; }
    .detail_anim_tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.8rem; }
    .detail_anim_tag {
      font-size: 1.2rem; color: #2b6cb0; background: #ebf3fb;
      border: 1px solid #cfe0f2; border-radius: 0.5rem; padding: 0.25rem 0.7rem;
    }
    .detail_anim_code {
      font-family: ui-monospace, Consolas, monospace; font-size: 1.15rem;
      white-space: pre; overflow: auto; max-height: 16rem;
      background: #1d1f27; color: #d7dae0; border-radius: 0.6rem;
      padding: 0.9rem 1.1rem; margin: 0.4rem 0 0.8rem;
    }
    .detail_anim_lottie { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .detail_anim_lottie a {
      font-size: 1.2rem; color: #7a3ea0; background: #f6edfb;
      border: 1px solid #e2cef0; border-radius: 0.5rem; padding: 0.3rem 0.8rem; text-decoration: none;
    }
    /* 左の大枠で「抜き出したアニメを実際に動かして」見せるステージ */
    .detail_anim_stage { padding: 0.4rem; }
    .detail_pane_anim_wrap { }
    .anim_stage_grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
      gap: 1.2rem;
    }
    .anim_cell {
      background: #fff; border: 1px solid #ececf0; border-radius: 0.8rem;
      padding: 0.9rem; text-align: center;
    }
    .anim_cell_stage {
      height: 12rem; display: flex; align-items: center; justify-content: center;
      background: #f4f5f8; border-radius: 0.6rem; overflow: hidden;
    }
    /* 実際のサイト画像に、抜き出した動きを当てて再生するプレビュー箱（無限ループ） */
    .anim_demo_box {
      width: 90%; aspect-ratio: 16 / 10;
      background-color: #fff;
      background-size: cover; background-position: top center;
      border-radius: 0.6rem; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
      animation-duration: 1.8s;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-direction: alternate;
    }
    .anim_lottie_cell lottie-player { width: 100%; height: 12rem; }
    .anim_cell_name {
      margin-top: 0.6rem; font-size: 1.15rem; color: #555;
      font-family: ui-monospace, Consolas, monospace; word-break: break-all;
    }
    .anim_stage_hint {
      color: #999; font-size: 1.35rem; line-height: 1.8em;
      padding: 3rem 2rem; text-align: center;
    }
    /* 表示モード切替（サイト全体 / サンプル一覧） */
    .anim_modebar { display: flex; gap: 0.6rem; margin-bottom: 1rem; }
    .anim_mode {
      font-size: 1.25rem; color: #444; background: #f0f0f2;
      border: 1px solid #ddd; border-radius: 0.8rem; padding: 0.5rem 1.1rem; cursor: pointer;
    }
    .anim_mode.is_on { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }
    .anim_replay {
      margin-left: auto; font-size: 1.25rem; color: #2b6cb0;
      background: #ebf3fb; border: 1px solid #cfe0f2; border-radius: 0.8rem;
      padding: 0.5rem 1.1rem; cursor: pointer;
    }
    .anim_replay:hover { background: #dcecfb; }
    /* サイト全体プレビュー：本物のサイトのように縦に繋げ、上から順に出現 */
    /* 継ぎ目対策：同じ画像を重ねて clip-path で各セクションだけ見せる（位置ズレ0） */
    .anim_site { width: 100%; max-width: 100rem; margin: 0 auto; }
    /* カードのホバーと同じ「サイトを自動スクロールして動かす」窓 */
    .anim_scroller {
      position: relative; width: 100%; height: 68vh; max-height: 62rem;
      overflow: hidden; border-radius: 0.6rem; background: #fff;
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.12);
    }
    .anim_scroll_img {
      position: absolute; top: 0; left: 0; width: 100%; display: block;
      will-change: transform;
    }
    /* 録画動画（本物のアニメ）を全体プレビューで再生。縦長を高さ基準で大きく＆黒帯なし */
    .anim_scroller_video {
      height: 74vh; max-height: none; width: auto; max-width: 100%;
      margin: 0 auto; aspect-ratio: 4 / 5;   /* JSが実寸比で上書き */
    }
    .anim_video_el {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #000; display: block;
    }
    .anim_note { font-size: 1.2rem; color: #8a8a8f; margin-bottom: 0.6rem; line-height: 1.6em; }
    /* スクロールで出現（reveal）。--rev に抽出したkeyframe名が入る */
    .anim_reveal { opacity: 0; }
    .anim_reveal.is_in {
      animation-name: var(--rev, anim_reveal_default);
      animation-duration: 0.9s;
      animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      animation-fill-mode: both;
    }
    /* 抽出物に"入り"アニメが無いとき用の保険 */
    @keyframes anim_reveal_default {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: none; }
    }
    .detail_extract.is_anim { color: #2b6cb0; background: #ebf3fb; border-color: #cfe0f2; }
    .detail_extract.is_anim:hover { background: #dcecfb; }
    /* アニメ抜き出し中の進捗（経過秒＋目安に対する伸びるバー） */
    .anim_prog { margin-top: 0.7rem; max-width: 34rem; }
    .anim_prog_bar { height: 0.7rem; background: #e6eef8; border-radius: 0.4rem; overflow: hidden; }
    .anim_prog_bar span {
      display: block; height: 100%; width: 0%;
      background: #2b6cb0; border-radius: 0.4rem;
      transition: width 0.2s linear;
    }
    .anim_prog_text { margin-top: 0.45rem; font-size: 1.2rem; color: #2b6cb0; }
    .detail_actions { margin-top: 1.8rem; }
    .detail_base {
      font-size: 1.4rem; font-weight: 700; color: #fff; background: #b8530a;
      border: none; border-radius: 1rem; padding: 1rem 1.8rem; cursor: pointer;
    }
    .detail_base:hover { background: #a04708; }
  </style>
</head>
<body>
  <!-- 検索バー（上部固定）。Enter または ボタンで検索 -->
  <header class="search_bar">
    <div class="search_inner">
      <input
        class="search_input"
        type="text"
        id="query"
        placeholder="雰囲気を言葉で（例：落ち着いた上品な青系 / 黒背景でミニマル）"
        autofocus>
      <input class="search_top" type="number" id="top" value="24" min="1" max="100" title="表示件数">
      <button class="search_button" id="go">検索</button>
    </div>
    <p class="search_hint">言葉を変えて何度でも試せます。カードの「似てるのを探す」で芋づる式にたどれます。</p>

    <!-- コンパクトなツールバー：主要トグルを1行にまとめてギャラリーを広く見せる -->
    <div class="toolbar">
      <button class="tool_btn tool_set" id="set_toggle">⚙ 設定</button>
      <button class="tool_btn tool_camp" id="camp_toggle">🎨 カンプを生成</button>
      <button class="tool_btn tool_add" id="add_toggle">＋ サイトを登録</button>
    </div>

    <!-- 設定パネル（生成エンジン・APIキー・一括言語化。トグルで開く） -->
    <div class="set_panel" id="set_panel">
      <div class="set_row">
        <span class="set_label">カンプ生成エンジン</span>
        <label class="set_radio"><input type="radio" name="provider" value="anthropic"> Claude (Opus 4.8)</label>
        <label class="set_radio"><input type="radio" name="provider" value="openai"> GPT (OpenAI)</label>
      </div>
      <div class="set_row">
        <span class="set_label">OpenAIモデル</span>
        <input class="set_input set_input_s" id="set_openai_model" placeholder="gpt-5.4 / gpt-5.5">
      </div>
      <div class="set_row">
        <span class="set_label">OpenAI APIキー</span>
        <input class="set_input" id="set_openai_key" type="password" placeholder="sk-... （空欄なら変更しない）">
        <span class="set_state" id="set_openai_state"></span>
      </div>
      <div class="set_row">
        <span class="set_label">Anthropic APIキー</span>
        <input class="set_input" id="set_anthropic_key" type="password" placeholder="sk-ant-... （空欄なら変更しない）">
        <span class="set_state" id="set_anthropic_state"></span>
      </div>
      <div class="set_actions">
        <button class="set_save" id="set_save">設定を保存（.envに書き込み）</button>
        <button class="set_test" id="set_test">接続テスト</button>
        <span class="set_msg" id="set_msg"></span>
      </div>
      <!-- 一括：未処理サイトを裏で全部言語化（設定内に移動） -->
      <div class="set_row set_row_sep">
        <span class="set_label">未処理サイト</span>
        <button class="bulk_button" id="describe_all">✨ 未処理を全部言語化（裏で進む）</button>
        <span class="bulk_state" id="describe_all_state"></span>
      </div>
    </div>

    <!-- カンプ生成パネル：ストックを参照して新しいカンプHTMLを作る（最終目標） -->
    <div class="camp_panel" id="camp_panel">
      <!-- mix & match：ベースA(見た目)＋アニメ参照B(動き)を選ぶ -->
      <div class="camp_mix">
        <label class="camp_lbl">🎨 ベース（見た目・レイアウト）
          <select class="camp_sel" id="camp_base"><option value="">おまかせ（ブリーフから自動選択）</option></select>
        </label>
        <label class="camp_lbl">🎞 アニメ参照（動きの種類）
          <select class="camp_sel" id="camp_anim"><option value="">なし（標準のふわっと出現）</option></select>
        </label>
      </div>
      <textarea
        class="camp_input"
        id="camp_input"
        placeholder="作りたいサイトを書く（例：製造業のコーポレートサイト。落ち着いた青系で信頼感。会社概要・製品・採用のセクション）　※生成は2分前後かかります"></textarea>
      <div class="camp_actions">
        <button class="camp_button" id="camp_button">この内容でカンプを生成</button>
        <span class="camp_state" id="camp_state"></span>
      </div>
      <!-- 生成中/完了ジョブの一覧（複数同時進行を並べて表示） -->
      <div class="camp_jobs" id="camp_jobs"></div>
    </div>

    <!-- 登録パネル：URLを入力して追加する（トグルで開く） -->
    <div class="add_panel" id="add_panel">
      <textarea
        class="add_input"
        id="add_input"
        placeholder="登録したいURLを入力（複数なら1行に1つ）&#10;https://example.com&#10;https://another.com"></textarea>
      <div class="add_actions">
        <button class="add_button" id="add_button">登録する（撮影＋ベクトル化）</button>
        <span class="add_state" id="add_state"></span>
      </div>
    </div>
  </header>

  <p class="result_status" id="status">登録済みのサイトを表示しています。</p>
  <main class="result_list" id="list"></main>

  <!-- 詳細ビュー（カードの画像クリックで開く・サンプルをしっかり見る画面） -->
  <div class="detail_overlay" id="detail_overlay">
    <div class="detail_modal">
      <button class="detail_close" id="detail_close" title="閉じる">✕</button>
      <div class="detail_head">
        <a class="detail_url" id="detail_url" target="_blank" rel="noopener noreferrer"></a>
        <span class="detail_date" id="detail_date"></span>
      </div>
      <div class="detail_body">
        <!-- 左：全体ビジュアル（全体スクショ／録画を切替） -->
        <div class="detail_visual">
          <div class="detail_tabs">
            <button class="detail_tab is_on" data-tab="full">全体スクショ</button>
            <button class="detail_tab" data-tab="video" id="detail_tab_video">録画</button>
            <button class="detail_tab" data-tab="anim">🎞 アニメ再生</button>
            <!-- アニメ再生時のモードボタンは、この右寄せスロットに入れる（縦を節約） -->
            <div class="detail_modebar_slot" id="detail_modebar_slot"></div>
          </div>
          <div class="detail_pane" id="detail_pane_full"><img id="detail_full_img" alt="サイト全体"></div>
          <div class="detail_pane" id="detail_pane_video" hidden>
            <video id="detail_video_el" controls loop muted playsinline></video>
          </div>
          <!-- 抜き出したアニメを「実際に動かして」見せる大枠 -->
          <div class="detail_pane" id="detail_pane_anim" hidden>
            <div class="detail_anim_stage" id="detail_anim_stage"></div>
          </div>
        </div>
        <!-- 右：参考情報（色・フォント・ライブラリ・雰囲気） -->
        <div class="detail_info">
          <h4 class="detail_h">配色（クリックでコピー）</h4>
          <div class="detail_swatches" id="detail_swatches"></div>
          <h4 class="detail_h">フォント</h4>
          <div class="detail_kv" id="detail_fonts"></div>
          <h4 class="detail_h">その他</h4>
          <div class="detail_kv" id="detail_meta"></div>
          <h4 class="detail_h">アニメ系ライブラリ</h4>
          <div class="detail_libs" id="detail_libs"></div>
          <h4 class="detail_h">雰囲気</h4>
          <p class="detail_vibe" id="detail_vibe"></p>
          <h4 class="detail_h">画像（このサイトから抜き出し）</h4>
          <div class="detail_assets" id="detail_assets"></div>
          <button class="detail_extract" id="detail_extract">🖼 画像を抜き出す</button>
          <h4 class="detail_h">アニメーション（このサイトから抜き出し）</h4>
          <div class="detail_anim" id="detail_anim"></div>
          <button class="detail_extract is_anim" id="detail_extract_anim">🎞 アニメを抜き出す</button>
          <!-- 抜き出し中の進捗（バー＋経過秒＋目安。終わりが見えるように） -->
          <div class="anim_prog" id="anim_prog" hidden>
            <div class="anim_prog_bar"><span id="anim_prog_fill"></span></div>
            <div class="anim_prog_text" id="anim_prog_text"></div>
          </div>
          <div class="detail_actions">
            <button class="detail_base" id="detail_base">🎨 これをベースに生成</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // JSが動かす部品は素直にidで掴む（このページはJS専用ページなので衝突しない）
    const input  = document.querySelector("#query");
    const topBox = document.querySelector("#top");
    const goBtn  = document.querySelector("#go");
    const list   = document.querySelector("#list");
    const status = document.querySelector("#status");

    // カード1枚分のHTMLを組み立てる
    function card(hit) {
      const score = (hit.score === null || hit.score === undefined)
        ? "" : `<span class="result_score">${hit.score.toFixed(4)}</span>`;
      const date = hit.captured_at ? hit.captured_at.slice(0, 10) : "";
      return `
        <article class="result_item">
          <!-- ホバーで流し見（録画があれば動画）、クリックで詳細ビューを開く -->
          <div class="result_anchor" data-detail="${hit.site_id}" role="button" tabindex="0" title="クリックで詳細">
            <img class="result_img" src="${hit.img}" alt="サイトのファーストビュー" loading="lazy">
            <!-- data-full は重いので、ホバーした時に初めて読み込む -->
            <img class="result_full" data-full="/img/${hit.site_id}/fullpage" alt="サイト全体">
            ${hit.has_video ? `<video class="result_video" data-src="/video/${hit.site_id}" muted loop playsinline preload="none"></video>` : ""}
            ${score}
            <span class="result_peek">${hit.has_video ? "ホバーで動き / クリックで詳細" : "ホバーで全体 / クリックで詳細"}</span>
          </div>
          <div class="result_body">
            <a class="result_url" href="${hit.url}" target="_blank" rel="noopener noreferrer">${hit.url}</a>
            ${(hit.swatches && hit.swatches.length) ? `<div class="result_swatches" title="抽出した配色">${hit.swatches.map((c) => `<span class="result_swatch" style="background:${c}"></span>`).join("")}</div>` : ""}
            ${(hit.libs && hit.libs.length) ? `<div class="result_libs">${hit.libs.map((l) => `<span class="result_lib">${l}</span>`).join("")}</div>` : ""}
            ${hit.vibe ? `<p class="result_vibe">${hit.vibe}</p>` : ""}
            <div class="result_meta">
              <span class="result_date">${date}</span>
              <div class="result_tools">
                <button class="result_similar" data-id="${hit.site_id}" title="この見た目に似たサイトを探す">🔍似てる</button>
                <button class="result_describe" data-id="${hit.site_id}" title="Claudeが雰囲気を言葉にして検索に効かせる">${hit.describing ? "言語化中…" : (hit.vibe ? "✨済" : "✨雰囲気")}</button>
                <button class="result_base" data-id="${hit.site_id}" title="このサイトの配色・字組みをベースにカンプ生成">🎨ベース</button>
                <button class="result_record" data-id="${hit.site_id}" title="${hit.has_video ? "動きを録り直す" : "ホバーで動きを見られるよう録画する"}">${hit.recording ? "録画中…" : (hit.has_video ? "🎬済" : "🎬動き")}</button>
                <button class="result_delete" data-id="${hit.site_id}" data-url="${hit.url}" title="削除">🗑</button>
              </div>
            </div>
          </div>
        </article>`;
    }

    // 結果を描画する
    function render(hits) {
      if (!hits.length) {
        list.innerHTML = `<p class="result_empty">ヒットなし。言葉を変えてみてください。</p>`;
        return;
      }
      list.innerHTML = hits.map(card).join("");
      setupHover();  // カードごとにホバーの流し見を仕込む
    }

    // ホバーすると、録画があれば動画を再生・なければ全体(fullpage)を流す
    function setupHover() {
      list.querySelectorAll(".result_anchor").forEach((anchor) => {
        const full = anchor.querySelector(".result_full");
        const vid = anchor.querySelector(".result_video");
        if (vid) anchor.classList.add("is_video");

        anchor.addEventListener("mouseenter", () => {
          anchor.classList.add("is_preview");
          if (vid) {
            // 動画があるカード：動画を再生（初回だけ読み込む）
            if (!vid.src) vid.src = vid.dataset.src;
            vid.currentTime = 0;
            vid.play().catch(() => {});
            return;
          }
          if (!full) return;
          if (!full.src) full.src = full.dataset.full;  // 初回だけ読み込む
          const startScroll = () => {
            const dist = full.offsetHeight - anchor.offsetHeight;  // 流す距離
            if (dist <= 0) return;  // 短いページは流さない
            const dur = Math.min(10, Math.max(2.5, dist / 180));
            full.style.transition = `transform ${dur}s linear`;
            requestAnimationFrame(() => {
              full.style.transform = `translateY(-${dist}px)`;
            });
          };
          if (full.complete && full.naturalHeight) startScroll();
          else full.onload = startScroll;
        });

        anchor.addEventListener("mouseleave", () => {
          anchor.classList.remove("is_preview");
          if (vid) { vid.pause(); return; }
          if (!full) return;
          full.style.transition = "transform 0.4s ease";
          full.style.transform = "translateY(0)";  // 先頭に戻す
        });
      });
    }

    // 「動きを録る」：録画を依頼 → 完了をポーリングして反映
    async function record(siteId, btn) {
      btn.disabled = true;
      btn.textContent = "録画中…";
      status.textContent = "実ブラウザでスクロールしながら録画しています…（十数秒）";
      const res = await fetch("/api/record_animation", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: siteId }),
      });
      const data = await res.json();
      if (!data.ok) { status.textContent = data.message; btn.disabled = false; btn.textContent = "🎬動きを録る"; return; }
      // 完了するまで /api/sites を見て has_video を待つ
      const wait = async () => {
        const s = await fetch("/api/sites").then((r) => r.json());
        const me = s.hits.find((h) => h.site_id === siteId);
        if (me && me.has_video) {
          status.textContent = "録画できました。ホバーで動きが見られます。";
          loadAll();
        } else {
          setTimeout(wait, 1500);
        }
      };
      setTimeout(wait, 1500);
    }

    // text検索
    async function search() {
      const q = input.value.trim();
      const top = topBox.value || 24;
      if (!q) { loadAll(); return; }
      status.textContent = `「${q}」で検索中…`;
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&top=${top}`);
      const data = await res.json();
      status.textContent = `「${data.query}」の検索結果：${data.hits.length} 件（スコアが高いほど雰囲気が近い）`;
      render(data.hits);
    }

    // 似た検索（登録済みサイト起点・モデル不要で一瞬）
    async function similar(siteId) {

      const res = await fetch(`/api/similar?id=${encodeURIComponent(siteId)}&top=${top}`);
      const data = await res.json();
      status.textContent = `このサイトに似たデザイン：${data.hits.length} 件`;

    // 「未処理を全部言語化」：裏でまとめて進める。進捗を見ながら一覧を更新
    const descAllBtn = document.querySelector("#describe_all");

    async function pollDescribeAll() {

    // 設定パネル：プロバイダ・APIキーを .env に保存
    const setToggle = document.querySelector("#set_toggle");

    async function loadSettings() {

    // 接続テスト：入力中のキー（未保存でもOK）で、本当に使えるか確かめる

    document.querySelectorAll('input[name="provider"]').forEach((r) => {

    // カンプ生成：ブリーフを送る → 裏で生成 → できたら新タブで開く
    const campToggle = document.querySelector("#camp_toggle");
    const campPanel = document.querySelector("#camp_panel");
    const campInput = document.querySelector("#camp_input");
    const campBtn = document.querySelector("#camp_button");
    const campState = document.querySelector("#camp_state");
    campToggle.addEventListener("click", () => {
      campPanel.classList.toggle("is_open");
      if (campPanel.classList.contains("is_open")) campInput.focus();
    });
    // 複数ジョブの管理（同時進行OK）。ローカルで開始時刻を覚えて経過秒を出す。
    const campJobs = document.querySelector("#camp_jobs");
    const _campLocal = {};   // job_id -> { start, brief }
    const _campOpened = {};  // 完了時に1回だけ新タブで開くための記録
    let _campPoller = null;

    campBtn.addEventListener("click", async () => {
      const brief = campInput.value.trim();
      if (!brief) { campState.textContent = "作りたいサイトを書いてください"; return; }
      const base_id = document.querySelector("#camp_base").value;
      const anim_id = document.querySelector("#camp_anim").value;
      campState.textContent = "";
      try {
        const res = await fetch("/api/generate_camp", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ brief, base_id, anim_id }),
        });
        const data = await res.json();
        if (!data.ok) { campState.textContent = data.message; return; }
        _campLocal[data.job_id] = { start: Date.now(), brief };
        campState.textContent = "生成を開始しました（下に進捗が出ます／続けて別の生成もできます）";
        renderCampJobs({});      // すぐに「開始中」カードを出す
        startCampPoller();
      } catch (e) { campState.textContent = "通信エラー：" + e; }
    });

    function startCampPoller() {
      if (_campPoller) return;
      _campPoller = setInterval(pollCampAll, 1000);
      pollCampAll();
    }
    async function pollCampAll() {
      let data;
      try { data = await fetch("/api/generate_camp/status").then((r) => r.json()); }
      catch (e) { return; }
      const jobs = data.jobs || {};
      renderCampJobs(jobs);
      // ローカルに開始済みで、まだサーバーに現れていないジョブがあるか
      const localPending = Object.keys(_campLocal).some((id) => !jobs[id] || jobs[id].state === "running");
      if (!localPending) { clearInterval(_campPoller); _campPoller = null; }
    }
    const _esc = (s) => String(s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    // 1ジョブぶんのカード中身HTML（done は改善案・自由指示のUI付き）
    function jobCardHtml(j, sec) {
      const brief = _esc((j.brief || "").slice(0, 34));
      if (j.state === "done") {
        const refs = (j.refs || []).map((r) => r.url).join(" / ");
        const animRef = j.anim_ref ? `／動き:${_esc(j.anim_ref)}` : "";
        return `<div>✅ <b>${brief}</b>（${sec}秒）→ <a href="/camp/${j.file}" target="_blank" rel="noopener">カンプを開く</a> <span style="color:#999">（${_esc(refs)}${animRef}）</span></div>
          <div class="camp_edit_row">
            <button class="camp_suggest_btn" data-file="${j.file}">💡 改善案を出す</button>
            <input class="camp_edit_in" placeholder="自分で指示（例：全体を明るく／ヒーローを大きく）">
            <button class="camp_editall_btn" data-file="${j.file}">この指示で直す</button>
          </div>
          <div class="camp_sugg"></div>`;
      }
      if (j.state === "error") return `❌ <b>${brief}</b> 失敗：${_esc(j.message)}`;
      return `<div class="camp_job_bar"><span></span></div>🕒 <b>${brief}…</b> ｜ ${_esc(j.phase || "生成中")} ／ 経過 ${sec}秒`;
    }
    // ジョブ一覧を更新（done/error は1回だけ組んで＝改善案チップや入力を消さない）
    function renderCampJobs(jobs) {
      const ids = [...new Set([...Object.keys(_campLocal), ...Object.keys(jobs)])]
        .sort((a, b) => ((_campLocal[b]?.start || 0) - (_campLocal[a]?.start || 0)));
      ids.forEach((id) => {
        const j = jobs[id] || { state: "running", phase: "開始しています…", brief: _campLocal[id]?.brief };
        const start = _campLocal[id]?.start || Date.now();
        const sec = Math.floor((Date.now() - start) / 1000);
        let el = document.getElementById("cj_" + id);
        if (!el) { el = document.createElement("div"); el.id = "cj_" + id; campJobs.prepend(el); }
        el.className = "camp_job" + (j.state === "done" ? " is_done" : j.state === "error" ? " is_err" : "");
        // running は毎秒更新。done/error になったら一度だけ組み直す（以後は触らない）
        if (j.state === "running" || el.dataset.state !== j.state) {
          if (j.state !== "running") el.dataset.state = j.state;
          el.innerHTML = jobCardHtml(j, sec);
          if (j.state === "done" && !_campOpened[id]) { _campOpened[id] = 1; window.open("/camp/" + j.file, "_blank"); }
        }
      });
    }
    // 改善案・自由指示・チップ適用（ジョブ一覧内のクリックをまとめて受ける）
    campJobs.addEventListener("click", async (e) => {
      const sBtn = e.target.closest(".camp_suggest_btn");
      if (sBtn) { loadSuggestions(sBtn); return; }
      const chip = e.target.closest(".sugg_chip");
      if (chip) { applyEdit(chip.dataset.file, chip.dataset.section, chip.dataset.instruction); return; }
      const allBtn = e.target.closest(".camp_editall_btn");
      if (allBtn) {
        const inp = allBtn.parentElement.querySelector(".camp_edit_in");
        applyEdit(allBtn.dataset.file, -1, (inp?.value || "").trim());
      }
    });
    async function loadSuggestions(btn) {
      const file = btn.dataset.file;
      const box = btn.closest(".camp_job").querySelector(".camp_sugg");
      btn.disabled = true; btn.textContent = "考え中…（十数秒）";
      try {
        const data = await fetch("/api/camp_suggest", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ file }),
        }).then((r) => r.json());
        if (!data.ok) { box.textContent = data.message || "失敗しました"; btn.disabled = false; btn.textContent = "💡 改善案を出す"; return; }
        const chips = (data.suggestions || []).map((s) =>
          `<button class="sugg_chip" data-file="${file}" data-section="${s.section}" data-instruction="${_esc(s.instruction).replace(/"/g, "&quot;")}">${_esc(s.label)}</button>`
        ).join("");
        box.innerHTML = chips || "<span style='color:#999;font-size:1.2rem'>案が出ませんでした</span>";
        btn.disabled = false; btn.textContent = "💡 別の案を出す";
      } catch (err) { box.textContent = "通信エラー：" + err; btn.disabled = false; btn.textContent = "💡 改善案を出す"; }
    }
    function applyEdit(file, section, instruction) {
      if (!instruction) { campState.textContent = "指示が空です"; return; }
      fetch("/api/edit_camp", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ file, section: Number(section), instruction }),
      }).then((r) => r.json()).then((data) => {
        if (!data.ok) { campState.textContent = data.message; return; }
        _campLocal[data.job_id] = { start: Date.now(), brief: "部分編集: " + instruction.slice(0, 24) };
        campState.textContent = "部分編集を開始しました（下に進捗が出ます）";
        renderCampJobs({}); startCampPoller();
      }).catch((e) => { campState.textContent = "通信エラー：" + e; });
    }

    // 初期表示（登録済み一覧）
    async function loadAll() {
      const res = await fetch("/api/sites");
      const data = await res.json();
      status.textContent = `登録済み：${data.hits.length} 件（言葉で検索すると雰囲気の近い順に並びます）`;
      render(data.hits);
      populateCampSelects(data.hits);  // mix & match のドロップダウンを埋める
    }
    // カンプ生成の「ベースA」「アニメ参照B」セレクトを、登録サイトで埋める
    function populateCampSelects(sites) {
      const baseSel = document.querySelector("#camp_base");
      const animSel = document.querySelector("#camp_anim");
      if (!baseSel || !animSel) return;
      const shorten = (u) => u.replace(/^https?:\/\//, "").replace(/\/$/, "");
      const opts = (sites || []).map((s) => `<option value="${s.site_id}">${shorten(s.url)}</option>`).join("");
      baseSel.innerHTML = `<option value="">おまかせ（ブリーフから自動選択）</option>` + opts;
      animSel.innerHTML = `<option value="">なし（標準のふわっと出現）</option>` + opts;
    }

    // イベント：ボタン・Enter・「似てる」ボタン（カードは動的生成なので親で受ける）
    goBtn.addEventListener("click", search);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
    list.addEventListener("click", (e) => {
      const sim = e.target.closest(".result_similar");
      if (sim) { similar(sim.dataset.id); return; }
      const anchor = e.target.closest(".result_anchor");
      if (anchor) { openDetail(anchor.dataset.detail); return; }
      const rec = e.target.closest(".result_record");
      if (rec) { record(rec.dataset.id, rec); return; }
      const desc = e.target.closest(".result_describe");
      if (desc) { describe(desc.dataset.id, desc); return; }
      const base = e.target.closest(".result_base");
      if (base) { baseGenerate(base.dataset.id); return; }
      const del = e.target.closest(".result_delete");
      if (del) remove(del.dataset.id, del.dataset.url);
    });

    // 詳細ビュー：カードをクリックすると、そのサイトの全部を1画面で見る
    const detailOverlay = document.querySelector("#detail_overlay");
    let _currentDetail = null;  // いま開いているサイトの詳細（タブ切替で再利用）
    function switchDetailTab(tab) {
      document.querySelectorAll(".detail_tab").forEach((b) => b.classList.toggle("is_on", b.dataset.tab === tab));
      document.querySelector("#detail_pane_full").hidden = tab !== "full";
      document.querySelector("#detail_pane_video").hidden = tab !== "video";
      document.querySelector("#detail_pane_anim").hidden = tab !== "anim";
      const vel = document.querySelector("#detail_video_el");
      if (tab === "video") vel.play().catch(() => {}); else vel.pause();
      // アニメタブを開いたら再生開始。離れたら止めて、右端のモードボタンも消す。
      if (tab === "anim" && _currentDetail) renderAnimStage(_currentDetail);
      else {
        stopSitePreview();
        const slot = document.querySelector("#detail_modebar_slot");
        if (slot) slot.innerHTML = "";
      }
    }
    function closeDetail() {
      detailOverlay.classList.remove("is_open");
      document.querySelector("#detail_video_el").pause();
      stopSitePreview();  // 自動スクロール・動画を止める（CPU節約）
    }
    async function openDetail(id) {
      let d;
      try { d = await fetch("/api/site/" + id).then((r) => r.json()); }
      catch (e) { status.textContent = "詳細の取得に失敗：" + e; return; }
      _currentDetail = d;  // タブ切替（アニメ再生）で使い回す
      document.querySelector("#detail_url").textContent = d.url;
      document.querySelector("#detail_url").href = d.url;
      document.querySelector("#detail_date").textContent = "撮影日: " + (d.captured_at || "").slice(0, 10);
      document.querySelector("#detail_full_img").src = d.fullpage;
      const vtab = document.querySelector("#detail_tab_video");
      const vel = document.querySelector("#detail_video_el");
      if (d.has_video) { vtab.style.display = ""; vel.src = d.video; } else { vtab.style.display = "none"; vel.removeAttribute("src"); }
      // 動画があるサイトは「アニメ再生（動画）」を主役として最初に表示する
      switchDetailTab(d.has_video ? "anim" : "full");
      // 配色（重複・透明を除く）
      const t = d.tokens || {};
      const seen = new Set(), uniq = [];
      [...(t.accent || []), ...(t.bg || []), ...(t.text || [])].forEach((c) => {

      document.querySelector("#detail_libs").innerHTML = (d.libs || []).length
        ? d.libs.map((l) => `<span class="result_lib">${l}</span>`).join("")
        : "<span style='color:#999;font-size:1.3rem'>検出なし</span>";

    }
    // 抜き出したアニメ素材（keyframes/transition/Lottie）を描画
    function renderAnim(d) {
      const box = document.querySelector("#detail_anim");
      const btn = document.querySelector("#detail_extract_anim");
      const a = d.anim || {};
      const kf = a.keyframes || [], tr = a.transitions || [], lot = a.lottie || [];
      const parts = [];
      // 使える keyframes 名をタグで、本文をコード片で
      if (kf.length) {
        parts.push(`<div class="detail_anim_tags">${kf.map((k) => `<span class="detail_anim_tag">@${k.name}</span>`).join("")}</div>`);
        parts.push(`<div class="detail_anim_code">${kf.slice(0, 6).map((k) => escapeHtml(k.css)).join("\n\n")}</div>`);
      }
      if (tr.length) {
        parts.push(`<h4 class="detail_h" style="margin-top:.4rem">transition</h4>`);
        parts.push(`<div class="detail_anim_code">${tr.map(escapeHtml).join("\n")}</div>`);
      }
      if (lot.length) {
        parts.push(`<h4 class="detail_h" style="margin-top:.4rem">Lottie JSON</h4>`);
        parts.push(`<div class="detail_anim_lottie">${lot.map((u, i) => `<a href="${u}" target="_blank" rel="noopener">🎬 lottie_${i}.json</a>`).join("")}</div>`);
      }
      box.innerHTML = parts.length ? parts.join("") : "<span style='color:#999;font-size:1.3rem'>まだ抜き出していません</span>";
      const has = kf.length || tr.length || lot.length;
      if (d.anim_extracting) { btn.disabled = true; btn.textContent = "抜き出し中…（十数秒）"; }
      else { btn.disabled = false; btn.textContent = has ? "🎞 もう一度抜き出す" : "🎞 アニメを抜き出す"; }
    }
    // コード片をそのまま安全に表示するためのHTMLエスケープ
    function escapeHtml(s) {
      return String(s || "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    }
    // Lottie の再生に使う web component を、必要になった時だけ読み込む
    let _lottieLoad = null;
    function ensureLottie() {
      if (window.customElements && customElements.get("lottie-player")) return Promise.resolve(true);
      if (_lottieLoad) return _lottieLoad;
      _lottieLoad = new Promise((res) => {
        const s = document.createElement("script");
        s.src = "https://unpkg.com/@lottiefiles/lottie-player@2.0.8/dist/lottie-player.js";
        s.onload = () => res(true);
        s.onerror = () => res(false);
        document.head.appendChild(s);
      });
      return _lottieLoad;
    }
    // 抽出した @keyframes をページに注入する（デモ箱が実際に動くようにするため）
    function injectKeyframes(kf) {
      let el = document.getElementById("anim_kf_style");
      if (!el) { el = document.createElement("style"); el.id = "anim_kf_style"; document.head.appendChild(el); }
      el.textContent = (kf || []).map((k) => k.css).join("\n");
    }
    // "入り"に使える keyframe を1つ選ぶ（サイト全体プレビューのreveal用）
    function pickRevealKeyframe(kf) {
      const pref = ["fadeup", "fadein", "slideup", "slidein", "reveal", "appear"];
      for (const p of pref) {
        const hit = (kf || []).find((k) => (k.name || "").toLowerCase().includes(p));
        if (hit) return hit.name;
      }
      return (kf && kf[0]) ? kf[0].name : "anim_reveal_default";
    }
    // サンプル一覧（keyframeごとの小さな実サイト画像＋Lottie）
    function buildAnimGrid(d, kf, lot) {
      const preview = d.firstview || "";
      const cells = [];
      lot.forEach((u, i) => {
        cells.push(`<div class="anim_cell anim_lottie_cell"><div class="anim_cell_stage"><lottie-player src="${u}" background="transparent" speed="1" loop autoplay></lottie-player></div><div class="anim_cell_name">lottie_${i}.json</div></div>`);
      });
      kf.forEach((k) => {
        cells.push(`<div class="anim_cell"><div class="anim_cell_stage"><div class="anim_demo_box" style="animation-name:${k.name}; background-image:url('${preview}')"></div></div><div class="anim_cell_name">@${escapeHtml(k.name)}</div></div>`);
      });
      return `<div class="anim_stage_grid">${cells.join("")}</div>`;
    }
    // サイト全体プレビュー
    let _panRAF = null;
    function stopAutoPan() { if (_panRAF) { cancelAnimationFrame(_panRAF); _panRAF = null; } }
    // 全体プレビューを止める（スクロール停止＋動画停止）
    function stopSitePreview() {
      stopAutoPan();
      const v = document.querySelector("#anim_site video");
      if (v) v.pause();
    }
    function sliceSitePreview() {
      const box = document.querySelector("#anim_site");
      if (!box) return;
      const d = _currentDetail || {};
      // ★本物のアニメは録画動画にしか無い。録画があればそれを再生（カードのホバーと同じ動き）。
      if (d.has_video && d.video) {
        stopAutoPan();
        // controls付き＝バーでシーク・一時停止できる。さらにホイールで前後スクロール可。
        box.innerHTML = `<div class="anim_note">🖱 マウスホイールで前後にスクロール／下のバーでも操作できます</div>`
          + `<div class="anim_scroller anim_scroller_video"><video class="anim_video_el" src="${d.video}" muted loop autoplay playsinline controls></video></div>`;
        const v = box.querySelector("video");
        const scroller = box.querySelector(".anim_scroller");
        if (v) {
          // 枠を録画の実寸比に合わせる（縦長でも横長でも黒帯ゼロで表示）
          v.addEventListener("loadedmetadata", () => {
            if (v.videoWidth && v.videoHeight) {
              v.parentElement.style.aspectRatio = v.videoWidth + " / " + v.videoHeight;
            }
          });
          v.play().catch(() => {});
          // マウスホイールで動画をシーク＝サイトを自分でスクロールする感覚
          scroller.addEventListener("wheel", (ev) => {
            if (!v.duration) return;
            ev.preventDefault();
            v.pause();
            const step = (ev.deltaY / 100) * 0.4;  // 1ノッチ ≒ 0.4秒ぶん進む/戻る
            v.currentTime = Math.max(0, Math.min(v.duration - 0.05, v.currentTime + step));
          }, { passive: false });
        }
        return;
      }
      // 録画が無い場合：スクショを自動スクロール（写真なので本物のアニメは出ない＝録画を促す）
      const url = box.dataset.full;
      box.innerHTML = `<div class="anim_note">これは静止画（スクショ）の自動スクロールです。実際のフェードイン等の動きを見るには、カード右下の「🎬動き」で録画してください。</div>`
        + `<div class="anim_scroller" id="anim_scroller"><img class="anim_scroll_img" id="anim_scroll_img" src="${url}" alt="サイト全体"></div>`;
      const img = document.querySelector("#anim_scroll_img");
      const begin = () => playSiteReveal();
      if (img.complete && img.naturalHeight) begin();
      else img.onload = begin;
    }
    // 自動スクロール（上→下→上をゆっくり繰り返す）。カードのホバーと同じ"動き"。
    function playSiteReveal() {
      stopAutoPan();
      const win = document.querySelector("#anim_scroller");
      const img = document.querySelector("#anim_scroll_img");
      if (!win || !img) return;
      const maxY = Math.max(0, img.clientHeight - win.clientHeight);
      if (maxY < 5) return;  // スクロールする高さが無ければ何もしない
      let y = 0, dir = 1, last = performance.now();
      const speed = 90;  // px/秒（スクロールの速さ）
      const loop = (now) => {
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        y += dir * speed * dt;
        if (y >= maxY) { y = maxY; dir = -1; }   // 一番下で折り返す
        else if (y <= 0) { y = 0; dir = 1; }     // 一番上で折り返す
        img.style.transform = `translateY(${-y}px)`;
        _panRAF = requestAnimationFrame(loop);
      };
      _panRAF = requestAnimationFrame(loop);
    }
    // 左の大枠で、抜き出したアニメを「実際に動かして」見せる
    function renderAnimStage(d) {
      const stage = document.querySelector("#detail_anim_stage");
      if (!stage) return;
      const a = d.anim || {};
      const kf = a.keyframes || [], lot = a.lottie || [];
      injectKeyframes(kf);
      const rev = pickRevealKeyframe(kf);
      // サンプル一覧は抽出物があれば描画、無ければ案内（動画プレビュー自体は常に出す）
      const gridHtml = (kf.length || lot.length)
        ? buildAnimGrid(d, kf, lot)
        : `<div class="anim_stage_hint">CSSアニメ/Lottieはまだ抜き出していません。右の「🎞 アニメを抜き出す」で抽出できます。</div>`;
      // モードボタンはタブ行の右端スロットへ（動画の縦を最大化）
      const slot = document.querySelector("#detail_modebar_slot");
      if (slot) {
        slot.innerHTML = `
          <button class="anim_mode is_on" data-mode="site">🖥 サイト全体で再生</button>
          <button class="anim_mode" data-mode="grid">🔲 動きサンプル一覧</button>
          <button class="anim_replay" id="anim_replay">▶ 最初から</button>`;
      }
      stage.innerHTML = `
        <div class="anim_view" id="anim_view_site">
          <div class="anim_site" id="anim_site" data-full="${d.fullpage}" data-rev="${rev}"></div>
        </div>
        <div class="anim_view" id="anim_view_grid" hidden>${gridHtml}</div>`;
      if (lot.length) ensureLottie();
      sliceSitePreview();  // カードのホバーと同じ「自動スクロールで動かす」を仕込む
    }
    // モード切替（サイト全体 / サンプル一覧）＋「最初から」。ボタンは .detail_visual 内にある
    document.querySelector(".detail_visual").addEventListener("click", (e) => {
      if (e.target.closest("#anim_replay")) { sliceSitePreview(); return; }
      const btn = e.target.closest(".anim_mode");
      if (!btn) return;
      const mode = btn.dataset.mode;
      document.querySelectorAll("#detail_modebar_slot .anim_mode").forEach((b) => b.classList.toggle("is_on", b === btn));
      document.querySelector("#anim_view_site").hidden = mode !== "site";
      document.querySelector("#anim_view_grid").hidden = mode !== "grid";
      if (mode === "site") sliceSitePreview();  // サイトに戻したら再生（録画優先）
      else stopSitePreview();                   // サンプル一覧では止める
    });
    // 抜き出した画像のギャラリーを描画
    function renderAssets(d) {
      const box = document.querySelector("#detail_assets");
      const btn = document.querySelector("#detail_extract");
      box.innerHTML = (d.assets || []).length
        ? d.assets.map((u) => `<a class="detail_asset" href="${u}" target="_blank" rel="noopener" title="クリックで原寸"><img src="${u}" alt="抜き出した画像" loading="lazy"></a>`).join("")
        : "<span style='color:#999;font-size:1.3rem'>まだ抜き出していません</span>";
      if (d.extracting) { btn.disabled = true; btn.textContent = "抜き出し中…（十数秒）"; }
      else { btn.disabled = false; btn.textContent = (d.assets || []).length ? "🖼 もう一度抜き出す" : "🖼 画像を抜き出す"; }
    }
    // 「画像を抜き出す」：実ページから収集 → 完了したらギャラリー更新
    document.querySelector("#detail_extract").addEventListener("click", async (e) => {
      const id = e.currentTarget.dataset.id;
      const btn = e.currentTarget;
      btn.disabled = true; btn.textContent = "抜き出し中…（十数秒）";
      const res = await fetch("/api/extract_images", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      });
      const data = await res.json();
      if (!data.ok) { btn.disabled = false; btn.textContent = "🖼 画像を抜き出す"; status.textContent = data.message; return; }
      const wait = async () => {
        const d = await fetch("/api/site/" + id).then((r) => r.json());
        if (d.extracting) { setTimeout(wait, 1500); }
        else { renderAssets(d); status.textContent = `画像を ${(d.assets || []).length} 枚 抜き出しました`; }
      };
      setTimeout(wait, 1500);
    });
    // アニメ抜き出しの進捗バー（経過秒を出しつつ、目安に対して伸ばす＝終わりが見える）
    let _animProgTimer = null;
    function startAnimProgress() {
      const wrap = document.querySelector("#anim_prog");
      const fill = document.querySelector("#anim_prog_fill");
      const txt = document.querySelector("#anim_prog_text");
      wrap.hidden = false;
      const start = Date.now();
      const EST = 20;  // 目安の秒数（この辺で終わることが多い）
      clearInterval(_animProgTimer);
      _animProgTimer = setInterval(() => {
        const sec = (Date.now() - start) / 1000;
        // 目安までは素直に伸び、超えたら95%で足踏み（完了で100%にする）
        const pct = Math.min(95, (sec / EST) * 100);
        fill.style.width = pct.toFixed(0) + "%";
        // 60秒を超えたら異常（バックエンドは25秒前後で必ず終わる）→ 案内を出す
        txt.textContent = sec > 60
          ? `時間がかかっています… ${sec.toFixed(0)} 秒（サーバー再起動が必要かも）`
          : `抜き出し中… ${sec.toFixed(0)} 秒（目安 ${EST} 秒）`;
      }, 200);
    }
    function finishAnimProgress(ok) {
      clearInterval(_animProgTimer); _animProgTimer = null;
      const wrap = document.querySelector("#anim_prog");
      const fill = document.querySelector("#anim_prog_fill");
      const txt = document.querySelector("#anim_prog_text");
      fill.style.width = "100%";
      txt.textContent = ok ? "完了！" : "終了しました";
      setTimeout(() => { wrap.hidden = true; fill.style.width = "0%"; }, 1200);
    }
    // 「アニメを抜き出す」：実ページから @keyframes/transition/Lottie を収集 → 完了したら描画
    document.querySelector("#detail_extract_anim").addEventListener("click", async (e) => {
      const id = e.currentTarget.dataset.id;
      const btn = e.currentTarget;
      btn.disabled = true; btn.textContent = "抜き出し中…";
      startAnimProgress();
      const res = await fetch("/api/extract_anim", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id }),
      });
      const data = await res.json();
      if (!data.ok) {
        finishAnimProgress(false);
        btn.disabled = false; btn.textContent = "🎞 アニメを抜き出す"; status.textContent = data.message; return;
      }
      const wait = async () => {
        let d;
        // 一時的な通信エラーで監視が止まらないよう、失敗しても再試行する
        try { d = await fetch("/api/site/" + id).then((r) => r.json()); }

        else {
          finishAnimProgress(true);
          _currentDetail = d;         // 左のアニメ再生タブでも使えるよう更新
          renderAnim(d);
          renderAnimStage(d);         // 左の大枠を「実際に動く」状態へ更新
          const a = d.anim || {};
          status.textContent = `アニメを抜き出しました（keyframes ${(a.keyframes || []).length} / transition ${(a.transitions || []).length} / Lottie ${(a.lottie || []).length}）`;
        }
      };
      setTimeout(wait, 1200);
    });
    document.querySelector("#detail_close").addEventListener("click", closeDetail);
    detailOverlay.addEventListener("click", (e) => {
      if (e.target === detailOverlay) { closeDetail(); return; }

      if (tab) { switchDetailTab(tab.dataset.tab); return; }

    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDetail(); });

    // 「🎨ベースに生成」：このサイトの配色・字組みを主役にしてカンプ生成
    function baseGenerate(siteId) {
      // このサイトを「ベースA」に設定して mix & match パネルを開く

    }

    // 「✨雰囲気」：Claudeに雰囲気を言語化させる → 完了をポーリングして反映
    async function describe(siteId, btn) {
      btn.disabled = true;
      btn.textContent = "言語化中…";
      status.textContent = "Claudeがサイトの雰囲気を言葉にしています…";
      const res = await fetch("/api/describe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },

      });

      const wait = async () => {

        if (me && me.vibe) {
          status.textContent = "雰囲気を言語化しました。抽象的な言葉でも探しやすくなります。";
          loadAll();

          setTimeout(wait, 1500);
        }
      };
      setTimeout(wait, 1500);
    }

    // 削除：確認してからサーバに依頼 → 一覧を更新
    async function remove(siteId, url) {
      if (!confirm(`このサイトを削除しますか？\n${url}`)) return;
      const res = await fetch("/api/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },

    // 登録パネルの開閉

    // 登録：URLを送って「ジョブ」を開始 → 進捗をポーリングして表示する
    // （撮影は1件ずつ時間がかかるので、1リクエストで待たせず裏で進める）
    async function register() {
      const urls = addInput.value.trim();
      if (!urls) { addState.textContent = "URLを入力してください"; return; }
      addBtn.disabled = true;
      addState.textContent = "登録を開始しています…";
      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ urls }),
        });
        const data = await res.json();
        if (!data.ok) { addState.textContent = data.message || "開始できませんでした"; addBtn.disabled = false; return; }
        addInput.value = "";
        pollProgress();  // 進捗の監視を始める
      } catch (err) {
        addState.textContent = "通信エラー：" + err;
        addBtn.disabled = false;
      }
    }

    // 進捗を1.2秒ごとに見に行き、状況をテキストで出す
    async function pollProgress() {
      try {
        const res = await fetch("/api/register/status");
        const j = await res.json();
        if (j.state === "running") {
          if (j.phase === "capture") {
            addState.textContent = `撮影中 ${j.done}/${j.total}：${j.current || ""}`;
          } else if (j.phase === "embed") {
            addState.textContent = `ベクトル化中…（撮影 ${j.saved}件 完了）`;
          }
          loadAll();  // 撮れたものから一覧に反映していく
          setTimeout(pollProgress, 1200);
        } else if (j.state === "done") {
          addState.textContent = j.message || "完了";
          addBtn.disabled = false;
          loadAll();
        } else if (j.state === "error") {
          addState.textContent = j.message || "エラーが発生しました";
          addBtn.disabled = false;
          loadAll();
        } else {
          addBtn.disabled = false;
        }
      } catch (err) {
        addState.textContent = "進捗の取得に失敗：" + err;
        addBtn.disabled = false;
      }
    }
    addBtn.addEventListener("click", register);

    loadAll();

    // ページを開いた時、進行中/完了のカンプ生成ジョブがあれば表示を復帰する
    // （生成中にリロードしても「今どうなってるか」が分かる。複数対応）
    (async function resumeCampIfRunning() {
      try {
        const data = await fetch("/api/generate_camp/status").then((r) => r.json());
        const jobs = data.jobs || {};
        if (!Object.keys(jobs).length) return;
        Object.keys(jobs).forEach((id) => {
          if (!_campLocal[id]) _campLocal[id] = { start: Date.now(), brief: jobs[id].brief };
          if (jobs[id].state !== "running") _campOpened[id] = 1;  // 既に終わってた分は自動で開かない
        });
        campPanel.classList.add("is_open");
        renderCampJobs(jobs);
        if (Object.values(jobs).some((j) => j.state === "running")) startCampPoller();
      } catch (e) {}
    })();
  </script>
</body>
</html>
